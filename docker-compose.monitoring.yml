name: calculator-monitoring

networks:
  monitoring:
    driver: bridge
  # Подключаемся к внутренней сети прода, чтобы scrape api
  calculator-prod_internal:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: calc-prometheus
    restart: unless-stopped
    networks: [monitoring, calculator-prod_internal]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 256m

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: calc-grafana
    restart: unless-stopped
    networks: [monitoring]
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://YOUR_DOMAIN/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 128m

  # ─── Loki (log aggregation) ───────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: calc-loki
    restart: unless-stopped
    networks: [monitoring]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    deploy:
      resources:
        limits:
          memory: 256m

  # ─── Promtail (log shipper: nginx + docker logs → Loki) ──────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: calc-promtail
    restart: unless-stopped
    networks: [monitoring]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./nginx/logs:/nginx/logs:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 64m
