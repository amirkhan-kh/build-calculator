# Backend stek (frontend Vercelda). Image serverning o'zida koddan yig'iladi.
# Ishga tushirish: bash scripts/deploy-server.sh
name: calculator-server

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  minio_data:
  redis_data:

x-backend: &backend
  build:
    context: ./backend
  image: calculator-backend:local
  env_file: .env
  networks: [internal]

services:
  postgres:
    image: postgres:17-alpine
    container_name: calc-postgres
    restart: unless-stopped
    networks: [internal]
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: calc-redis
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: calc-minio
    restart: unless-stopped
    networks: [internal]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      # Admin UI faqat SSH tunnel orqali: ssh -L 9001:localhost:9001 user@server
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend
    container_name: calc-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    container_name: calc-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    <<: *backend
    container_name: calc-celery
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=info", "--concurrency=2", "--time-limit=300"]

  # Faqat TELEGRAM_BOT_TOKEN bo'lsa: .env ga COMPOSE_PROFILES=bot qo'shing
  bot:
    <<: *backend
    container_name: calc-bot
    restart: unless-stopped
    profiles: [bot]
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "bot.app"]

  nginx:
    image: nginx:1.27-alpine
    container_name: calc-nginx
    restart: unless-stopped
    networks: [internal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MINIO_BUCKET: ${MINIO_BUCKET:-calculator-media}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/server-templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
