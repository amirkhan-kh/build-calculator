name: calculator-prod

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  db_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: calc-postgres
    restart: unless-stopped
    networks: [internal]
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Redis (Celery broker + result backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: calc-redis
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160m

  # ─── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: calc-minio
    restart: unless-stopped
    networks: [internal, public]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      # 9001 (MinIO Admin UI) не открываем — доступ только через SSH tunnel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── DB Migration (init-container, запускается один раз) ──────────────────
  migrate:
    image: shukhratbekovb/calculator-backend:latest
    container_name: calc-migrate
    networks: [internal]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ─── Backend API ────────────────────────────────────────────────────────────
  api:
    image: shukhratbekovb/calculator-backend:latest
    container_name: calc-api
    restart: unless-stopped
    networks: [internal]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery:
    image: shukhratbekovb/calculator-backend:latest
    container_name: calc-celery
    restart: unless-stopped
    networks: [internal]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=info", "--concurrency=2", "--time-limit=300"]
    deploy:
      resources:
        limits:
          memory: 256m

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: shukhratbekovb/calculator-frontend:latest
    container_name: calc-frontend
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - INTERNAL_API_URL=http://api:8000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ─── Nginx (reverse proxy + TLS termination) ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: calc-nginx
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
